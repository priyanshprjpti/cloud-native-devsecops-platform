name: DevSecOps CI

on:
  push:
    branches:
      - main

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t cloud-native-devsecops:v1 ./app

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloud-native-devsecops:v1
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: docker tag cloud-native-devsecops:v1 ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devsecops:v1

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devsecops:v1