name: DevSecOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t cloud-native-devsecops:${{ github.sha }} ./app

      - name: Validate Docker Image
        run: |
          docker image inspect cloud-native-devsecops:${{ github.sha }}

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloud-native-devsecops:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0